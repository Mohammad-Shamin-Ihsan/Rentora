server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Forward API calls to the backend container (same-origin, so no CORS needed)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The Angular app calls collection endpoints with the trailing slash, so
        # FastAPI's slash-redirect normally never fires; if a bare path is hit
        # directly, keep the 307 on this origin instead of an absolute upstream URL.
        proxy_redirect ~^https?://[^/]+(/.*)$ $1;
    }

    # SPA fallback: every other path serves the Angular shell
    location / {
        try_files $uri $uri/ /index.html;
    }
}
