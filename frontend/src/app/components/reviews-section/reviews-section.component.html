<section class="mt-10">
  <div class="flex flex-wrap items-center gap-4">
    <h2 class="text-4xl font-bold text-[#e8e6f5]">Customer Feedback</h2>

    <div *ngIf="summary" class="flex items-center gap-2">
      <span class="text-3xl font-bold text-[#e8e6f5]">{{ summary.average_rating || '—' }}</span>
      <app-star-rating [rating]="summary.average_rating" [readOnly]="true" [size]="20"></app-star-rating>
      <span class="text-base text-zinc-400">
        ({{ summary.review_count }} Review{{ summary.review_count === 1 ? '' : 's' }})
      </span>
    </div>
  </div>

  <div *ngIf="eligibleBookingId" class="mt-5">
    <app-review-form
      [productId]="productId"
      [bookingId]="eligibleBookingId"
      [currentUserId]="currentUserId"
      (submitted)="onReviewSubmitted()"
    ></app-review-form>
  </div>

  <div class="mt-5 space-y-3">
    <p *ngIf="loading" class="text-sm text-zinc-400">Loading reviews...</p>

    <p *ngIf="!loading && errorMessage" class="text-sm text-red-400">{{ errorMessage }}</p>

    <p *ngIf="!loading && !errorMessage && reviews.length === 0" class="text-sm text-zinc-400">
      No reviews yet — be the first to share your experience.
    </p>

    <app-review-card *ngFor="let review of reviews" [review]="review"></app-review-card>
  </div>

  <div *ngIf="totalPages > 1" class="mt-5 flex items-center justify-center gap-3">
    <button
      [disabled]="page <= 1"
      (click)="goToPage(-1)"
      class="rounded-full border border-white/10 px-3 py-1 text-xs text-zinc-300 disabled:opacity-40"
    >
      Prev
    </button>
    <span class="text-xs text-zinc-500">Page {{ page }} of {{ totalPages }}</span>
    <button
      [disabled]="page >= totalPages"
      (click)="goToPage(1)"
      class="rounded-full border border-white/10 px-3 py-1 text-xs text-zinc-300 disabled:opacity-40"
    >
      Next
    </button>
  </div>
</section>
