<div class="relative overflow-hidden rounded-2xl border border-white/5 bg-[#211a29] p-6">
  <!-- Decorative oversized quotation mark, matching the design's subtle
       background flourish in the top-right of each review card. -->
  <span
    class="pointer-events-none absolute -top-3 right-5 select-none text-6xl font-serif text-white/5"
    aria-hidden="true"
  >&rdquo;</span>

  <div class="flex items-start justify-between gap-4">
    <div class="flex items-center gap-3">
      <img
        *ngIf="review.user.avatar_url; else initialsAvatar"
        [src]="review.user.avatar_url"
        [alt]="review.user.name"
        class="h-14 w-14 rounded-full object-cover"
      />
      <ng-template #initialsAvatar>
        <div
          class="flex h-14 w-14 items-center justify-center rounded-full bg-gradient-to-br from-fuchsia-500 to-orange-500 text-sm font-semibold text-white"
        >
          {{ initials }}
        </div>
      </ng-template>

      <div>
        <p class="text-lg font-bold text-white">{{ review.user.name }}</p>
        <p class="text-sm text-zinc-400">
          {{ review.verified_rental ? 'Verified Rental' : 'Rental' }} &middot; {{ timeAgo }}
        </p>
      </div>
    </div>

    <app-star-rating [rating]="review.rating" [readOnly]="true" [size]="18"></app-star-rating>
  </div>

  <p *ngIf="review.review_text" class="relative mt-5 text-base italic leading-relaxed text-zinc-300">
    "{{ review.review_text }}"
  </p>
</div>
